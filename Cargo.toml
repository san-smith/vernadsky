[workspace]
resolver = "3"
members = ["crates/core", "crates/climate", "crates/biome", "crates/hydrology", "crates/terrain", "crates/territory", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.92.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Shared dependencies are declared here and inherited by members; the core
# crate currently has none by design.
[workspace.dependencies]
