[package]
name = "vernadsky-terrain"
description = "Heightmap and erosion stage of the Vernadsky planetary geography generator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vernadsky-core = { path = "../core", version = "0.1.0" }
fastnoise-lite = "1.1"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
vernadsky-climate = { path = "../climate", version = "0.1.0" }
vernadsky-biome = { path = "../biome", version = "0.1.0" }
vernadsky-hydrology = { path = "../hydrology", version = "0.1.0" }
