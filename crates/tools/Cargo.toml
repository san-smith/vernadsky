[package]
name = "vernadsky-tools"
description = "Debug visualization and export tools for the Vernadsky planetary geography generator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vernadsky-core = { path = "../core", version = "0.1.0" }
vernadsky-climate = { path = "../climate", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
